name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --no-sources

      - name: Run tests
        run: uv run pytest --tb=short

  # ── Lint & type check ────────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --no-sources

      - name: Ruff check
        run: uv run ruff check src/mcp_ksef_pl/ tests/ audit/

      - name: Ruff format check
        run: uv run ruff format --check src/mcp_ksef_pl/ tests/ audit/

      - name: Mypy
        run: uv run mypy src/mcp_ksef_pl
        continue-on-error: true  # Non-blocking: 39 pre-existing type errors, tracked separately

  # ── Pre-publish audit ──────────────────────────────────────────────────────
  audit:
    name: Pre-publish audit vs mcp-einvoicing-core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # --no-sources: resolve mcp-einvoicing-core from PyPI in this standalone repo.
        # --upgrade: audit against the latest compatible core release, not whatever
        # the committed uv.lock happens to pin.
        run: uv sync --all-extras --no-sources --upgrade

      - name: Run pre-publish audit
        # Exit code 2 = blocking failures → job fails
        # Exit code 1 = warnings only     → job passes (informational)
        run: uv run python audit/audit_vs_core.py --output audit/report.json --fail-on blocking

      - name: Upload audit report
        if: always()   # Upload even on failure so the report is inspectable
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit/report.json
