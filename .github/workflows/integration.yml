name: KSeF integration tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "KSeF environment (test or demo)"
        required: true
        default: "test"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          KSEF_ENVIRONMENT: ${{ inputs.environment }}
          KSEF_SESSION_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
          KSEF_NIP: ${{ secrets.KSEF_TEST_NIP }}
        run: uv run pytest -m integration -v
