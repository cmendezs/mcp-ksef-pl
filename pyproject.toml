[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ksef-pl"
version = "0.8.0"
description = "MCP server for Polish electronic invoicing — KSeF FA(3)/FA(2) and Peppol BIS 3.0/EN 16931"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Christophe Mendez" }]
requires-python = ">=3.11"
keywords = ["mcp", "ksef", "e-invoicing", "poland", "peppol", "en16931", "vat", "faktura"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp-einvoicing-core>=1.20.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
xslt2 = ["mcp-einvoicing-core[xslt2]>=1.20.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "lxml-stubs>=0.5.0",
    "saxonche>=12.4.0",
]

[project.scripts]
mcp-ksef-pl = "mcp_ksef_pl.server:main"

[project.urls]
Homepage = "https://github.com/cmendezs/mcp-ksef-pl"
Repository = "https://github.com/cmendezs/mcp-ksef-pl"
Issues = "https://github.com/cmendezs/mcp-ksef-pl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ksef_pl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires KSEF_ENVIRONMENT=test, KSEF_SESSION_TOKEN, and KSEF_NIP"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
